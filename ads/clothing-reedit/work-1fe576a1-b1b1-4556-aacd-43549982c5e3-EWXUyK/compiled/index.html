  :root { --pine: #0c2a22; --cloud: #eceeed; --ink: #0e1412; --graphite: #56605b; --fog: #c6ccc8; --gold: #f0b455; --goldd: #c9821f; }
  html, body { margin: 0; background: var(--pine); }
  body { font-family: "Instrument Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--pine); }
  .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }

  #bg { background: radial-gradient(70% 45% at 70% 30%, rgba(240,180,85,.10), transparent 70%), var(--pine); }
  #cloudbg { background: var(--cloud); opacity: 0; }
  #grain { opacity: .08; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }

  /* full-bleed b-roll: graded toward Pine, drifting */
  #fullwin { overflow: hidden; opacity: 0; }
  #fullcam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 45%; filter: saturate(.82) contrast(1.1) brightness(.96); }
  #fulltint { background: linear-gradient(rgba(12,42,34,.72), rgba(12,42,34,.25) 36%, rgba(12,42,34,.05) 55%, rgba(12,42,34,.35)); mix-blend-mode: multiply; }
  /* presenter window: the talking head cropped tight to the face (the old captions sit outside the crop) */

<script type="text/hf-after-fonts">const T = window.TIMING, SEGS = {}, tl = gsap.timeline({ paused: true });

  [["callout", "For clothing brands"], ["ad1", "Ad 01"], ["ad2", "Ad 02"], ["ad3", "Ad 03"], ["how", "Under a week"], ["retainer", "Most agencies"]].forEach(([id, txt]) =>

  // ---- captions: chunks of up to 4 words (break on punctuation), lead + key, one gold underline ----
  const GOLD = { callout: "owners.", ad1: "one.", ad2: "two.", ad3: "three.", only: "sells.", how: "week.", sellers: "sellers,", angles: "angles", angles2: "care", make: "15.", make_ads: "ads.", faces: "faces,", hooks: "hooks,", settings: "settings.", test: "test.", meta: "sell.",
    kill: "winners,", retainer: "retainer.", offer: "creatives," };
  const NOCAP = new Set(["experiment", "cta"]);
  const FIX = { meta: "Meta", "15.": "15", "Meta": "Meta" };

    if (NOCAP.has(s.id)) return;
    let cur = []; const ws = wd(s.id);
    ws.forEach((w, j) => { cur.push(w); if (cur.length >= 5 || (/[.,?:!]$/.test(w.text) && cur.length >= 2) || j === ws.length - 1) { chunks.push({ seg: s, w: cur }); cur = []; } });
  });

    ld.className = "ld"; ky.className = "ky"; el.appendChild(ld); el.appendChild(ky);
    const keyTxt = c.w.slice(k).map((w) => w.text).join(" ");
    ky.style.fontSize = Math.round(Math.min(150, 936 * 1.75 / Math.max(5, keyTxt.length))) + "px";
    let gold = false;
    c.w.forEach((w, j) => {

      tl.fromTo(sp, { y: 24, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.18, ease: E.in }, w.start);
      if (!gold && j >= k && GOLD[c.seg.id] === w.text) { gold = true; const u = document.createElement("i"); u.className = "ul"; sp.appendChild(u);
        tl.to(u, { scaleX: 1, duration: 0.22, ease: "power2.out" }, w.start + 0.1); }
    });
    const nx = chunks[n + 1], end = nx ? Math.min(nx.w[0].start - 0.04, c.seg.start + c.seg.vdur + (nx.seg === c.seg ? 0 : 0.6)) : c.seg.start + c.seg.vdur;
    tl.set(el, { opacity: 1 }, c.w[0].start - 0.02); tl.to(el, { opacity: 0, y: -12, duration: 0.12, ease: "power1.in" }, end - 0.12);

    tl.to(t, { scale: 1.18, zIndex: 5, duration: 0.3, ease: E.ui }, W("kill", 4) + n * 0.06); });
  // new versions of the winners slide into the dead slots
